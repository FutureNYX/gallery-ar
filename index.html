<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View in Your Room</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; font-family: -apple-system, sans-serif; }

      #overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.85);
        color: #fff;
        text-align: center;
        padding: 32px;
      }
      #overlay h1 { font-size: 22px; font-weight: 500; margin-bottom: 12px; }
      #overlay p { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 32px; max-width: 280px; }
      #overlay .icon { font-size: 48px; margin-bottom: 20px; }
      #start-btn { background: #fff; color: #000; border: none; padding: 14px 32px; border-radius: 100px; font-size: 16px; font-weight: 500; cursor: pointer; }

      #instructions { position: absolute; bottom: 40px; left: 0; right: 0; z-index: 50; text-align: center; color: #fff; font-size: 14px; padding: 12px 24px; pointer-events: none; display: none; }
      #instructions .pill { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 100px; padding: 10px 20px; display: inline-block; }

      #placed-ui { position: absolute; bottom: 40px; left: 0; right: 0; z-index: 50; text-align: center; display: none; }
      #placed-ui button { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); border-radius: 100px; padding: 10px 20px; color: #fff; font-size: 14px; cursor: pointer; margin: 0 6px; }

      #painting-info { position: absolute; top: 20px; left: 0; right: 0; z-index: 50; text-align: center; display: none; }
      #painting-info .pill { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 100px; padding: 8px 16px; color: #fff; font-size: 13px; display: inline-block; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe.min.js"></script>
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
    <script async src="https://apps.8thwall.com/xrweb?appKey=NEEDS_REAL_KEY"></script>
  </head>

  <body>
    <div id="overlay">
      <div class="icon">🖼</div>
      <h1>View in your room</h1>
      <p>Hold your phone at chest height, then point the camera at the floor near the wall where you want to hang the painting.</p>
      <button id="start-btn">Start AR</button>
    </div>

    <div id="instructions">
      <div class="pill" id="instruction-text">Point camera at floor near a wall, then tap to place</div>
    </div>

    <div id="placed-ui">
      <button id="replace-btn">Move it</button>
      <button id="info-btn">Size info</button>
    </div>

    <div id="painting-info">
      <div class="pill" id="info-text"></div>
    </div>

    <a-scene
      xrweb="disableWorldTracking: false"
      xrextras-loading
      xrextras-runtime-error
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
    >
      <a-assets>
        <img id="painting-tex" crossorigin="anonymous" />
      </a-assets>

      <a-camera id="camera" position="0 1.5 0" xrextras-tap-recenter></a-camera>

      <a-entity id="painting-root" visible="false">
        <a-plane id="painting-plane" width="1" height="1"
          material="src: #painting-tex; shader: standard; roughness: 0.85; metalness: 0.0"
          position="0 0 0">
        </a-plane>
        <a-plane id="painting-frame" width="1.06" height="1.06"
          material="color: #1a1a1a; roughness: 0.9; metalness: 0.1"
          position="0 0 -0.005">
        </a-plane>
        <a-plane id="wall-shadow" width="1.2" height="1.2"
          material="color: #000000; opacity: 0.18; transparent: true"
          position="0 0 -0.01">
        </a-plane>
      </a-entity>

      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light id="dir-light" type="directional" intensity="0.8" position="1 3 2"></a-light>
    </a-scene>

    <script>
      const params    = new URLSearchParams(window.location.search)
      const imgUrl    = params.get('img')   || 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/402px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg'
      const widthCm   = parseFloat(params.get('w'))     || 77
      const heightCm  = parseFloat(params.get('h'))     || 100
      const title     = params.get('title') || 'Painting'
      const wM = widthCm  / 100
      const hM = heightCm / 100

      let placed = false

      window.addEventListener('load', () => {
        document.getElementById('painting-tex').src = imgUrl
        const plane = document.getElementById('painting-plane')
        plane.setAttribute('width',  wM)
        plane.setAttribute('height', hM)
        const frame = document.getElementById('painting-frame')
        frame.setAttribute('width',  wM + 0.06)
        frame.setAttribute('height', hM + 0.06)
        const shadow = document.getElementById('wall-shadow')
        shadow.setAttribute('width',  wM + 0.2)
        shadow.setAttribute('height', hM + 0.2)
        document.getElementById('info-text').textContent = title + ' · ' + widthCm + ' x ' + heightCm + ' cm'
      })

      document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('overlay').style.display = 'none'
        document.getElementById('instructions').style.display = 'block'
      })

      const scene = document.querySelector('a-scene')

      scene.addEventListener('click', (e) => {
        if (document.getElementById('overlay').style.display !== 'none') return
        if (!scene.hasLoaded) return

        const camera   = document.getElementById('camera').object3D
        const origin   = new THREE.Vector3()
        const direction = new THREE.Vector3()
        camera.getWorldPosition(origin)
        camera.getWorldDirection(direction)

        const t = -origin.y / direction.y
        if (!t || t < 0.3 || t > 6) return

        const floorHit  = origin.clone().addScaledVector(direction, t)
        const toCamera  = new THREE.Vector3(origin.x - floorHit.x, 0, origin.z - floorHit.z).normalize()

        placePainting(floorHit, toCamera)
      })

      function placePainting(floorPoint, wallNormal) {
        const root  = document.getElementById('painting-root')
        const pos   = {
          x: floorPoint.x + wallNormal.x * 0.01,
          y: 1.5,
          z: floorPoint.z + wallNormal.z * 0.01
        }
        const angle = Math.atan2(wallNormal.x, wallNormal.z) * (180 / Math.PI)
        root.setAttribute('position', pos.x + ' ' + pos.y + ' ' + pos.z)
        root.setAttribute('rotation', '0 ' + angle + ' 0')
        root.setAttribute('visible', true)
        placed = true
        document.getElementById('instruction-text').textContent = 'Tap anywhere to reposition'
        document.getElementById('placed-ui').style.display      = 'block'
        document.getElementById('painting-info').style.display  = 'block'
      }

      document.getElementById('replace-btn').addEventListener('click', () => {
        document.getElementById('painting-root').setAttribute('visible', false)
        placed = false
        document.getElementById('placed-ui').style.display     = 'none'
        document.getElementById('painting-info').style.display = 'none'
        document.getElementById('instruction-text').textContent = 'Point camera at floor near a wall, then tap'
      })

      document.getElementById('info-btn').addEventListener('click', () => {
        const info = document.getElementById('painting-info')
        info.style.display = info.style.display === 'none' ? 'block' : 'none'
      })

      setInterval(() => {
        try {
          const le = XR8.XrController.getLightEstimate && XR8.XrController.getLightEstimate()
          if (le) {
            const intensity = Math.max(0.4, Math.min(2.0, le.ambientIntensity / 800))
            document.getElementById('dir-light').setAttribute('intensity', intensity)
          }
        } catch(e) {}
      }, 500)
    </script>
  </body>
</html>
