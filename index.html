<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <title>View in Your Room</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,sans-serif; }
    #camerafeed { position:fixed; top:0; left:0; width:100vw; height:100vh; display:block; }
    #overlay {
      position:fixed; inset:0; z-index:999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.88); color:#fff; text-align:center; padding:32px;
    }
    #overlay .icon { font-size:52px; margin-bottom:18px; }
    #overlay h1   { font-size:22px; font-weight:500; margin-bottom:10px; }
    #overlay p    { font-size:14px; color:rgba(255,255,255,0.65); line-height:1.65; margin-bottom:32px; max-width:270px; }
    #start-btn { background:#fff; color:#000; border:none; padding:16px 40px; border-radius:100px; font-size:17px; font-weight:600; cursor:pointer; touch-action:manipulation; }
    #hud { position:fixed; bottom:44px; left:0; right:0; z-index:100; text-align:center; pointer-events:none; display:none; }
    #hud-text { display:inline-block; background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.2); border-radius:100px; padding:11px 22px; color:#fff; font-size:14px; }
    #actions { position:fixed; bottom:44px; left:0; right:0; z-index:100; text-align:center; display:none; }
    #actions button { background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.25); border-radius:100px; padding:11px 22px; color:#fff; font-size:14px; cursor:pointer; margin:0 5px; touch-action:manipulation; }
    #info-bar { position:fixed; top:18px; left:0; right:0; z-index:100; text-align:center; display:none; pointer-events:none; }
    #info-bar span { display:inline-block; background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.2); border-radius:100px; padding:8px 18px; color:#fff; font-size:13px; }
    #debug { position:fixed; top:60px; left:10px; right:10px; z-index:200; font-size:11px; color:#0f0; pointer-events:none; font-family:monospace; text-shadow:0 0 3px #000; white-space:pre-wrap; line-height:1.6; }
    #version { position:fixed; top:18px; right:14px; z-index:200; font-size:11px; color:rgba(255,255,255,0.5); font-family:monospace; pointer-events:none; }
    #tap-surface { position:fixed; inset:0; z-index:50; display:none; touch-action:manipulation; }
    #reticle { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:44px; height:44px; pointer-events:none; display:none; z-index:60; }
    #reticle::before, #reticle::after { content:''; position:absolute; background:rgba(255,255,255,0.85); top:50%; left:50%; }
    #reticle::before { width:2px; height:26px; transform:translate(-50%,-50%); }
    #reticle::after  { width:26px; height:2px; transform:translate(-50%,-50%); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          async crossorigin="anonymous" data-preload-chunks="slam"></script>
</head>
<body>

  <canvas id="camerafeed"></canvas>
  <div id="version">v18</div>
  <div id="debug">v18 loading...</div>
  <div id="reticle"></div>
  <div id="tap-surface" ontouchend="handleTap(event)" onclick="handleTap(event)"></div>

  <div id="overlay">
    <div class="icon">&#128444;&#65039;</div>
    <h1>View in your room</h1>
    <p>Stand 1-2 metres from a wall, point your phone toward the wall, then tap to place the painting.</p>
    <button id="start-btn" ontouchend="startAR(event)" onclick="startAR(event)">Start AR</button>
  </div>

  <div id="hud"><span id="hud-text">Point phone at wall and tap</span></div>
  <div id="actions">
    <button ontouchend="resetPlacement(event)" onclick="resetPlacement(event)">Move it</button>
    <button ontouchend="toggleInfo(event)"     onclick="toggleInfo(event)">Size info</button>
  </div>
  <div id="info-bar"><span id="info-text"></span></div>

<script>
  const VERSION    = 'v18'
  const p          = new URLSearchParams(location.search)
  const wCm        = parseFloat(p.get('w'))  || 77
  const hCm        = parseFloat(p.get('h'))  || 100
  const title      = p.get('title')          || 'Van Gogh - Self-Portrait with Straw Hat, 1887'
  const PLACE_DIST = 1.6
  const wM         = wCm / 100
  const hM         = hCm / 100

  // Default test image: Van Gogh Self Portrait (public domain, Wikimedia CORS-open)
  // Swap this for any gallery painting URL via ?img=URL&w=WCM&h=HCM&title=NAME
  const imgSrc = p.get('img') ||
    '/painting.jpg'

  document.getElementById('info-text').textContent = title + '  ·  ' + wCm + ' x ' + hCm + ' cm'

  const logs = []
  function log(msg) {
    logs.unshift(VERSION + ' ' + msg)
    if (logs.length > 8) logs.pop()
    document.getElementById('debug').textContent = logs.join('\n')
    console.log('[AR]', msg)
  }

  let arStarted = false, tapCount = 0
  let paintingGroup = null, threeCamera = null, threeScene = null, threeRenderer = null

  function startAR(e) {
    if (e) { e.preventDefault(); e.stopPropagation() }
    log('Start AR')
    document.getElementById('overlay').style.display     = 'none'
    document.getElementById('hud').style.display         = 'block'
    document.getElementById('tap-surface').style.display = 'block'
    document.getElementById('reticle').style.display     = 'block'
    arStarted = true
  }

  const galleryArModule = {
    name: 'gallery-ar',

    onStart: ({canvas, GLctx}) => {
      log('Pipeline started ' + canvas.width + 'x' + canvas.height)

      threeRenderer = new THREE.WebGLRenderer({ canvas, context: GLctx, alpha: false, antialias: true })
      threeRenderer.autoClear            = false
      threeRenderer.outputEncoding       = THREE.sRGBEncoding
      threeRenderer.physicallyCorrectLights = true

      threeScene  = new THREE.Scene()
      threeCamera = new THREE.PerspectiveCamera(60, canvas.width / canvas.height, 0.01, 1000)
      threeCamera.position.set(0, 1.4, 0)
      threeScene.add(threeCamera)

      // Low ambient - the gallery spot does the real work
      threeScene.add(new THREE.AmbientLight(0xffe8cc, 0.15))

      // Painting group
      paintingGroup = new THREE.Group()
      paintingGroup.visible = false
      threeScene.add(paintingGroup)

      // Canvas surface - no sRGBEncoding on material, let the renderer handle it
      const canvasMat = new THREE.MeshStandardMaterial({
        color: 0xd4a84b,   // gold until texture loads
        roughness: 0.85,
        metalness: 0.0,
      })
      const canvasMesh = new THREE.Mesh(new THREE.PlaneGeometry(wM, hM), canvasMat)
      canvasMesh.position.z = 0.003
      paintingGroup.add(canvasMesh)

      // Frame
      const frameMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(wM + 0.055, hM + 0.055),
        new THREE.MeshStandardMaterial({ color: 0x2a1f0e, roughness: 0.95 })
      )
      frameMesh.position.z = 0.001
      paintingGroup.add(frameMesh)

      // Soft wall shadow behind frame
      const shadowMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(wM + 0.22, hM + 0.24),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.14 })
      )
      shadowMesh.position.z = -0.008
      paintingGroup.add(shadowMesh)

      // Gallery lighting attached to painting group so it travels with the piece
      // Warm 3000K tungsten spot from above-left (picture rail / track light style)
      const gallerySpot = new THREE.PointLight(0xffd580, 2.8, 4.0)
      gallerySpot.position.set(-0.4, 0.9, 0.6)
      paintingGroup.add(gallerySpot)

      // Soft warm fill from below-right (bounce off gallery floor)
      const fillLight = new THREE.PointLight(0xffe4b0, 0.5, 3.0)
      fillLight.position.set(0.5, -0.6, 0.5)
      paintingGroup.add(fillLight)

      log('Scene built. Loading texture...')

      // Load painting texture
      const loader = new THREE.TextureLoader()
      loader.crossOrigin = 'anonymous'
      loader.load(
        imgSrc,
        (tex) => {
          // Do NOT set tex.encoding - let Three.js r128 handle it naturally
          // Setting sRGBEncoding was causing the green tint in v14
          canvasMat.map   = tex
          canvasMat.color.setHex(0xffffff)
          canvasMat.needsUpdate = true
          log('Texture loaded OK!')
        },
        undefined,
        () => log('Texture failed - showing gold')
      )
    },

    onUpdate: ({processCpuResult}) => {
      const r = processCpuResult && processCpuResult.reality
      if (!r || !threeCamera) return
      const {rotation, position, intrinsics} = r
      if (rotation) threeCamera.quaternion.set(rotation.x, rotation.y, rotation.z, rotation.w)
      if (position) threeCamera.position.set(position.x, position.y, position.z)
      if (intrinsics) {
        for (let i = 0; i < 16; i++) threeCamera.projectionMatrix.elements[i] = intrinsics[i]
      }
    },

    onRender: () => {
      if (threeRenderer && threeScene && threeCamera) {
        threeRenderer.clearDepth()
        threeRenderer.render(threeScene, threeCamera)
      }
    },

    onCanvasSizeChange: ({canvasWidth, canvasHeight}) => {
      if (threeRenderer) threeRenderer.setSize(canvasWidth, canvasHeight, false)
      if (threeCamera)   { threeCamera.aspect = canvasWidth / canvasHeight; threeCamera.updateProjectionMatrix() }
      log('Resize: ' + canvasWidth + 'x' + canvasHeight)
    },

    onException: (e) => log('XR8 err: ' + String(e).slice(0, 80)),
  }

  const onxrloaded = () => {
    log('XR8 loaded')
    XR8.addCameraPipelineModules([
      XR8.GlTextureRenderer.pipelineModule(),
      XR8.XrController.pipelineModule(),
      galleryArModule,
    ])
    const canvas  = document.getElementById('camerafeed')
    const dpr     = window.devicePixelRatio || 1
    canvas.width  = Math.round(window.innerWidth  * dpr)
    canvas.height = Math.round(window.innerHeight * dpr)
    canvas.style.width  = window.innerWidth  + 'px'
    canvas.style.height = window.innerHeight + 'px'
    log('Canvas: ' + canvas.width + 'x' + canvas.height + ' dpr=' + dpr)
    XR8.run({ canvas, allowedDevices: XR8.XrConfig.device().ANY })
  }

  window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)

  function handleTap(e) {
    e.preventDefault(); e.stopPropagation()
    tapCount++
    log('Tap #' + tapCount)
    if (!arStarted || !paintingGroup || !threeCamera) return

    const dir = new THREE.Vector3()
    threeCamera.getWorldDirection(dir)
    dir.y = 0
    if (dir.length() < 0.05) { log('Too vertical'); return }
    dir.normalize()

    const pos  = threeCamera.position
    const camH = (pos.y > 0.1 && pos.y < 4.0) ? pos.y : 1.4
    const pt   = new THREE.Vector3(pos.x + dir.x * PLACE_DIST, camH, pos.z + dir.z * PLACE_DIST)
    const yRot = Math.atan2(-dir.x, -dir.z)

    paintingGroup.position.copy(pt)
    paintingGroup.rotation.set(0, yRot, 0)
    paintingGroup.visible = true

    log('Placed! dir=' + dir.x.toFixed(2) + ',' + dir.z.toFixed(2) + ' h=' + camH.toFixed(2))
    document.getElementById('hud').style.display      = 'none'
    document.getElementById('actions').style.display  = 'block'
    document.getElementById('info-bar').style.display = 'block'
  }

  function resetPlacement(e) {
    if (e) { e.preventDefault(); e.stopPropagation() }
    if (paintingGroup) paintingGroup.visible = false
    document.getElementById('hud').style.display      = 'block'
    document.getElementById('actions').style.display  = 'none'
    document.getElementById('info-bar').style.display = 'none'
    document.getElementById('hud-text').textContent   = 'Point phone at wall and tap'
    log('Reset')
  }

  function toggleInfo(e) {
    if (e) { e.preventDefault(); e.stopPropagation() }
    const bar = document.getElementById('info-bar')
    bar.style.display = bar.style.display === 'none' ? 'block' : 'none'
  }
</script>
</body>
</html>
