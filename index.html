<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <title>View in Your Room</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,sans-serif; }

    #overlay {
      position:fixed; inset:0; z-index:200;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.9); color:#fff; text-align:center; padding:32px;
    }
    #overlay .icon { font-size:52px; margin-bottom:18px; }
    #overlay h1   { font-size:22px; font-weight:500; margin-bottom:10px; }
    #overlay p    { font-size:14px; color:rgba(255,255,255,0.65); line-height:1.65; margin-bottom:28px; max-width:270px; }
    #start-btn {
      background:#fff; color:#000; border:none;
      padding:14px 36px; border-radius:100px;
      font-size:16px; font-weight:500; cursor:pointer;
    }
    #hud {
      position:fixed; bottom:44px; left:0; right:0; z-index:100;
      text-align:center; pointer-events:none; display:none;
    }
    #hud-text {
      display:inline-block; background:rgba(0,0,0,0.65);
      border:1px solid rgba(255,255,255,0.2); border-radius:100px;
      padding:11px 22px; color:#fff; font-size:14px;
    }
    #actions {
      position:fixed; bottom:44px; left:0; right:0; z-index:100;
      text-align:center; display:none;
    }
    #actions button {
      background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.25);
      border-radius:100px; padding:11px 22px;
      color:#fff; font-size:14px; cursor:pointer; margin:0 5px;
    }
    #info-bar {
      position:fixed; top:18px; left:0; right:0; z-index:100;
      text-align:center; pointer-events:none; display:none;
    }
    #info-bar span {
      display:inline-block; background:rgba(0,0,0,0.65);
      border:1px solid rgba(255,255,255,0.2); border-radius:100px;
      padding:8px 18px; color:#fff; font-size:13px;
    }
    #debug {
      position:fixed; top:60px; left:10px; right:10px; z-index:300;
      font-size:11px; color:#0f0; pointer-events:none;
      font-family:monospace; text-shadow:0 0 3px #000;
      white-space:pre-wrap; line-height:1.6;
    }
    #tap-surface { position:fixed; inset:0; z-index:50; display:none; }
    #reticle {
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:44px; height:44px; pointer-events:none; display:none;
    }
    #reticle::before, #reticle::after {
      content:''; position:absolute; background:rgba(255,255,255,0.85);
      top:50%; left:50%;
    }
    #reticle::before { width:2px; height:26px; transform:translate(-50%,-50%); }
    #reticle::after  { width:26px; height:2px; transform:translate(-50%,-50%); }
    a-scene { position:fixed; inset:0; }
  </style>

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          async crossorigin="anonymous" data-preload-chunks="slam"></script>
</head>
<body>

  <div id="overlay">
    <div class="icon">&#128444;</div>
    <h1>View in your room</h1>
    <p>Stand 1-2 metres from a wall. Point your phone toward the wall and tap to place the painting.</p>
    <button id="start-btn">Start AR</button>
  </div>

  <div id="hud"><span id="hud-text">Stand near a wall and tap to place</span></div>
  <div id="actions">
    <button id="btn-move">Move it</button>
    <button id="btn-info">Size info</button>
  </div>
  <div id="info-bar"><span id="info-text"></span></div>
  <div id="debug">Starting...</div>
  <div id="reticle"></div>
  <div id="tap-surface"></div>

  <a-scene
    xrconfig
    xrweb="disableWorldTracking: false; allowedDevices: any"
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <!-- Test image embedded as data URI - zero CORS issues on any device -->
      <img id="painting-tex" src="/test-painting.png"/>
    </a-assets>

    <a-camera id="camera" position="0 1.4 0"></a-camera>

    <a-entity id="painting-root" visible="false">
      <a-plane id="painting-plane" width="0.77" height="1.0"
        material="src:#painting-tex; shader:standard; roughness:0.88; metalness:0.02; side:double"
        position="0 0 0.001"></a-plane>
      <a-plane id="painting-frame" width="0.83" height="1.06"
        material="color:#1c1c1c; roughness:0.85; metalness:0.15; side:double"
        position="0 0 0"></a-plane>
      <a-plane id="wall-shadow" width="0.97" height="1.22"
        material="color:#000; opacity:0.13; transparent:true; side:double"
        position="0 0 -0.005"></a-plane>
    </a-entity>

    <a-light type="ambient"     id="ambient-light" intensity="0.7"></a-light>
    <a-light type="directional" id="dir-light"     intensity="0.8" position="1 3 1"></a-light>
  </a-scene>

<script>
  const p     = new URLSearchParams(location.search)
  const wCm   = parseFloat(p.get('w'))     || 77
  const hCm   = parseFloat(p.get('h'))     || 100
  const title = p.get('title') || 'Painting'
  const wM    = wCm / 100
  const hM    = hCm / 100

  // If an img URL param is provided, load it dynamically after scene starts
  // (avoids CORS issues by setting src via JS after page load)
  const imgParam = p.get('img')

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('info-text').textContent = title + '  ·  ' + wCm + ' x ' + hCm + ' cm'
    document.getElementById('painting-plane').setAttribute('width',  wM)
    document.getElementById('painting-plane').setAttribute('height', hM)
    document.getElementById('painting-frame').setAttribute('width',  wM + 0.06)
    document.getElementById('painting-frame').setAttribute('height', hM + 0.06)
    document.getElementById('wall-shadow').setAttribute('width',     wM + 0.20)
    document.getElementById('wall-shadow').setAttribute('height',    hM + 0.22)
  })

  const dbg  = document.getElementById('debug')
  const logs = []
  function log(msg) {
    logs.unshift(msg)
    if (logs.length > 6) logs.pop()
    dbg.textContent = logs.join('\n')
    console.log('[AR]', msg)
  }

  let arStarted = false
  let tapCount  = 0

  window.addEventListener('xrloaded', () => {
    log('XR engine ready')
    // If img URL param given, swap texture now that engine is running
    if (imgParam) {
      const tex = document.getElementById('painting-tex')
      tex.crossOrigin = 'anonymous'
      tex.src = imgParam
      log('Loading custom image...')
    }
  })

  document.querySelector('a-scene').addEventListener('loaded', () => {
    log('Scene ready - tap to place')
  })

  document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('overlay').style.display     = 'none'
    document.getElementById('hud').style.display         = 'block'
    document.getElementById('tap-surface').style.display = 'block'
    document.getElementById('reticle').style.display     = 'block'
    arStarted = true
    log('AR started - tap to place')
  })

  const DIST = 1.6

  function getPlacement() {
    const camEl = document.getElementById('camera')
    if (!camEl || !camEl.object3D) return null
    const cam = camEl.object3D
    const pos = new THREE.Vector3()
    cam.getWorldPosition(pos)
    const rawDir = new THREE.Vector3()
    cam.getWorldDirection(rawDir)
    const dir = new THREE.Vector3(rawDir.x, 0, rawDir.z)
    if (dir.length() < 0.1) { log('Point phone at wall'); return null }
    dir.normalize()
    const camH = (pos.y > 0.2 && pos.y < 3.5) ? pos.y : 1.4
    const pt = new THREE.Vector3(
      pos.x + dir.x * DIST,
      camH,
      pos.z + dir.z * DIST
    )
    const facingDir = dir.clone().negate()
    const yRot = Math.atan2(facingDir.x, facingDir.z) * (180 / Math.PI)
    return { pt, yRot, camH, dirStr: dir.x.toFixed(2) + ',' + dir.z.toFixed(2) }
  }

  function hangPainting(result) {
    const { pt, yRot } = result
    const root = document.getElementById('painting-root')
    root.setAttribute('position', pt.x.toFixed(3) + ' ' + pt.y.toFixed(3) + ' ' + pt.z.toFixed(3))
    root.setAttribute('rotation', '0 ' + yRot.toFixed(1) + ' 0')
    root.setAttribute('visible', 'true')
    document.getElementById('hud').style.display      = 'none'
    document.getElementById('actions').style.display  = 'block'
    document.getElementById('info-bar').style.display = 'block'
    log('Placed ' + pt.x.toFixed(2) + ',' + pt.y.toFixed(2) + ',' + pt.z.toFixed(2) + ' rot=' + yRot.toFixed(0))
  }

  function handleTap() {
    tapCount++
    if (!arStarted) return
    const result = getPlacement()
    if (!result) { log('No placement - tap #' + tapCount); return }
    log('Tap #' + tapCount + ' camH=' + result.camH.toFixed(2) + ' dir=' + result.dirStr)
    hangPainting(result)
  }

  const ts = document.getElementById('tap-surface')
  ts.addEventListener('touchend', (e) => { e.preventDefault(); handleTap() }, { passive: false })
  ts.addEventListener('click',    () => handleTap())

  document.getElementById('btn-move').addEventListener('click', (e) => {
    e.stopPropagation()
    document.getElementById('painting-root').setAttribute('visible', 'false')
    document.getElementById('hud').style.display      = 'block'
    document.getElementById('actions').style.display  = 'none'
    document.getElementById('info-bar').style.display = 'none'
    document.getElementById('hud-text').textContent   = 'Stand near a wall and tap to place'
    log('Reset - tap to place again')
  })

  document.getElementById('btn-info').addEventListener('click', (e) => {
    e.stopPropagation()
    const bar = document.getElementById('info-bar')
    bar.style.display = bar.style.display === 'none' ? 'block' : 'none'
  })

  setInterval(() => {
    if (!window.XR8) return
    try {
      const le = XR8.XrController.getLightEstimate && XR8.XrController.getLightEstimate()
      if (!le) return
      const i = Math.max(0.3, Math.min(1.8, le.ambientIntensity / 900))
      document.getElementById('dir-light').setAttribute('intensity', i.toFixed(2))
    } catch(e) {}
  }, 600)
</script>
</body>
</html>
