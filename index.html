<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <title>View in Your Room</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,sans-serif; }

    /* ── Intro overlay ── */
    #overlay {
      position:fixed; inset:0; z-index:200;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.88); color:#fff; text-align:center; padding:32px;
    }
    #overlay .icon { font-size:52px; margin-bottom:18px; }
    #overlay h1   { font-size:22px; font-weight:500; margin-bottom:10px; }
    #overlay p    { font-size:14px; color:rgba(255,255,255,0.65); line-height:1.65; margin-bottom:28px; max-width:270px; }
    #start-btn {
      background:#fff; color:#000; border:none;
      padding:14px 36px; border-radius:100px;
      font-size:16px; font-weight:500; cursor:pointer;
    }

    /* ── Instruction pill ── */
    #hud {
      position:fixed; bottom:44px; left:0; right:0; z-index:100;
      text-align:center; pointer-events:none; display:none;
    }
    #hud-text {
      display:inline-block;
      background:rgba(0,0,0,0.55);
      border:1px solid rgba(255,255,255,0.18);
      border-radius:100px; padding:11px 22px;
      color:#fff; font-size:14px;
    }

    /* ── Post-place buttons ── */
    #actions {
      position:fixed; bottom:44px; left:0; right:0; z-index:100;
      text-align:center; display:none;
    }
    #actions button {
      background:rgba(0,0,0,0.55);
      border:1px solid rgba(255,255,255,0.22);
      border-radius:100px; padding:11px 22px;
      color:#fff; font-size:14px; cursor:pointer; margin:0 5px;
    }

    /* ── Painting info bar ── */
    #info-bar {
      position:fixed; top:18px; left:0; right:0; z-index:100;
      text-align:center; pointer-events:none; display:none;
    }
    #info-bar span {
      display:inline-block;
      background:rgba(0,0,0,0.55);
      border:1px solid rgba(255,255,255,0.18);
      border-radius:100px; padding:8px 18px;
      color:#fff; font-size:13px;
    }

    /* ── A-Frame canvas fills window ── */
    a-scene { position:fixed; inset:0; }
  </style>

  <!-- 8th Wall modified A-Frame (8-Frame) -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <!-- XR Extras: loading screen, error handling, gesture helpers -->
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <!-- 8th Wall open source SLAM engine (no app key required) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          async crossorigin="anonymous" data-preload-chunks="slam"></script>
</head>

<body>

  <!-- Intro screen -->
  <div id="overlay">
    <div class="icon">&#128444;</div>
    <h1>View in your room</h1>
    <p>Hold your phone at chest height. Point your camera at the floor near the wall where you want to hang the painting, then tap.</p>
    <button id="start-btn">Start AR</button>
  </div>

  <!-- Step instruction -->
  <div id="hud"><span id="hud-text">Point camera at floor near a wall, then tap</span></div>

  <!-- Post-placement controls -->
  <div id="actions">
    <button id="btn-move">Move it</button>
    <button id="btn-info">Size info</button>
  </div>

  <!-- Painting dimensions pill -->
  <div id="info-bar"><span id="info-text"></span></div>

  <!-- ── A-Frame scene ── -->
  <a-scene
    xrconfig
    xrweb="disableWorldTracking: false; allowedDevices: any; scale: absolute"
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="painting-tex" crossorigin="anonymous"/>
    </a-assets>

    <!-- Camera at chest height for absolute scale calibration -->
    <a-camera id="camera" position="0 1.4 0" xrextras-tap-recenter></a-camera>

    <!-- Painting group: hidden until user taps -->
    <a-entity id="painting-root" visible="false">

      <!-- Main canvas surface -->
      <a-plane
        id="painting-plane"
        width="1" height="1"
        material="src:#painting-tex; shader:standard; roughness:0.88; metalness:0.02; side:front"
        position="0 0 0"
      ></a-plane>

      <!-- Frame: slightly larger dark rect sitting 4mm behind canvas -->
      <a-plane
        id="painting-frame"
        width="1.06" height="1.06"
        material="color:#1c1c1c; roughness:0.85; metalness:0.15"
        position="0 0 -0.004"
      ></a-plane>

      <!-- Soft wall shadow: semi-transparent plane 8mm behind canvas -->
      <a-plane
        id="wall-shadow"
        width="1.22" height="1.22"
        material="color:#000; opacity:0.15; transparent:true; side:front"
        position="0 0 -0.008"
      ></a-plane>

    </a-entity>

    <!-- Lights: ambient base + directional (updated by light estimation) -->
    <a-light type="ambient"      id="ambient-light" intensity="0.65" color="#fff"></a-light>
    <a-light type="directional"  id="dir-light"     intensity="0.8"  color="#fff" position="1 3 1"></a-light>

  </a-scene>

  <script>
    // ── Read URL params ──────────────────────────────────────────────────
    // Example: ?img=https://...&w=80&h=60&title=Painting+Name
    const p      = new URLSearchParams(location.search)
    const imgUrl = p.get('img')   || 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/402px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg'
    const wCm    = parseFloat(p.get('w'))     || 77
    const hCm    = parseFloat(p.get('h'))     || 100
    const title  = p.get('title') || 'Painting'
    const wM     = wCm  / 100   // convert cm -> metres
    const hM     = hCm  / 100

    // ── Set painting texture + real-world dimensions on load ─────────────
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('painting-tex').src = imgUrl
      document.getElementById('info-text').textContent = title + '  ·  ' + wCm + ' × ' + hCm + ' cm'

      const plane  = document.getElementById('painting-plane')
      const frame  = document.getElementById('painting-frame')
      const shadow = document.getElementById('wall-shadow')

      plane.setAttribute('width',  wM);       plane.setAttribute('height',  hM)
      frame.setAttribute('width',  wM+0.06);  frame.setAttribute('height',  hM+0.06)
      shadow.setAttribute('width', wM+0.22);  shadow.setAttribute('height', hM+0.22)
    })

    // ── UI state ─────────────────────────────────────────────────────────
    let arStarted = false
    let placed    = false

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('overlay').style.display = 'none'
      document.getElementById('hud').style.display     = 'block'
      arStarted = true
    })

    // ── Tap to place painting on wall ────────────────────────────────────
    // Technique: wall-from-floor
    //   1. Cast a ray from the camera downward through the tap point
    //   2. Find where that ray hits y=0 (the detected floor plane)
    //   3. Treat that floor point as the base of the wall
    //   4. Orient the painting to face the camera (horizontal normal only)
    //   5. Hang painting at eye height above that floor point

    const scene = document.querySelector('a-scene')

    scene.addEventListener('click', handleTap)
    scene.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) handleTap(e.touches[0])
    })

    function handleTap(e) {
      if (!arStarted) return
      if (!scene.hasLoaded)  return

      const camEl  = document.getElementById('camera')
      const cam3d  = camEl.object3D

      const origin = new THREE.Vector3()
      const dir    = new THREE.Vector3()
      cam3d.getWorldPosition(origin)
      cam3d.getWorldDirection(dir)

      // Intersect ray with floor plane (y = 0)
      if (Math.abs(dir.y) < 0.01) return   // ray nearly horizontal, skip
      const t = -origin.y / dir.y
      if (t < 0.4 || t > 7) return          // too near or too far

      const floorHit = origin.clone().addScaledVector(dir, t)

      // Wall normal = direction from floor hit back toward camera (horizontal only)
      const normal = new THREE.Vector3(origin.x - floorHit.x, 0, origin.z - floorHit.z)
      if (normal.length() < 0.001) return
      normal.normalize()

      hangPainting(floorHit, normal)
    }

    function hangPainting(floorPt, normal) {
      const root = document.getElementById('painting-root')

      // Hang at 1.5m above floor, 1cm in front of wall surface
      const px = floorPt.x + normal.x * 0.01
      const py = 1.5
      const pz = floorPt.z + normal.z * 0.01

      // Rotate to face camera
      const yRot = Math.atan2(normal.x, normal.z) * (180 / Math.PI)

      root.setAttribute('position', px + ' ' + py + ' ' + pz)
      root.setAttribute('rotation', '0 ' + yRot + ' 0')
      root.setAttribute('visible', 'true')

      placed = true
      document.getElementById('hud-text').textContent  = 'Looking good! Tap to reposition.'
      document.getElementById('actions').style.display = 'block'
      document.getElementById('info-bar').style.display = 'block'
    }

    // ── Move button: reset placement ─────────────────────────────────────
    document.getElementById('btn-move').addEventListener('click', () => {
      document.getElementById('painting-root').setAttribute('visible', 'false')
      document.getElementById('actions').style.display  = 'none'
      document.getElementById('info-bar').style.display = 'none'
      document.getElementById('hud-text').textContent   = 'Point camera at floor near a wall, then tap'
      placed = false
    })

    // ── Size info toggle ─────────────────────────────────────────────────
    document.getElementById('btn-info').addEventListener('click', () => {
      const bar = document.getElementById('info-bar')
      bar.style.display = bar.style.display === 'none' ? 'block' : 'none'
    })

    // ── Light estimation: match scene lighting to real room ──────────────
    // Runs every 600ms once AR is active
    setInterval(() => {
      if (!window.XR8) return
      try {
        const le = XR8.XrController.getLightEstimate && XR8.XrController.getLightEstimate()
        if (!le) return
        // Map ambient intensity (lux-ish 0-2000) to A-Frame light intensity 0.3-1.8
        const intensity = Math.max(0.3, Math.min(1.8, le.ambientIntensity / 900))
        document.getElementById('dir-light').setAttribute('intensity', intensity.toFixed(2))
      } catch(e) {}
    }, 600)

  </script>
</body>
</html>
