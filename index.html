<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <title>View in Your Room</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,sans-serif; }

    #overlay {
      position:fixed; inset:0; z-index:200;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.9); color:#fff; text-align:center; padding:32px;
    }
    #overlay .icon { font-size:52px; margin-bottom:18px; }
    #overlay h1   { font-size:22px; font-weight:500; margin-bottom:10px; }
    #overlay p    { font-size:14px; color:rgba(255,255,255,0.65); line-height:1.65; margin-bottom:28px; max-width:270px; }
    #start-btn {
      background:#fff; color:#000; border:none;
      padding:14px 36px; border-radius:100px;
      font-size:16px; font-weight:500; cursor:pointer;
    }

    #hud {
      position:fixed; bottom:44px; left:0; right:0; z-index:100;
      text-align:center; pointer-events:none; display:none;
    }
    #hud-text {
      display:inline-block; background:rgba(0,0,0,0.65);
      border:1px solid rgba(255,255,255,0.2); border-radius:100px;
      padding:11px 22px; color:#fff; font-size:14px;
    }

    #actions {
      position:fixed; bottom:44px; left:0; right:0; z-index:100;
      text-align:center; display:none;
    }
    #actions button {
      background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.25);
      border-radius:100px; padding:11px 22px;
      color:#fff; font-size:14px; cursor:pointer; margin:0 5px;
    }

    #info-bar {
      position:fixed; top:18px; left:0; right:0; z-index:100;
      text-align:center; pointer-events:none; display:none;
    }
    #info-bar span {
      display:inline-block; background:rgba(0,0,0,0.65);
      border:1px solid rgba(255,255,255,0.2); border-radius:100px;
      padding:8px 18px; color:#fff; font-size:13px;
    }

    /* reticle - crosshair shown at placement point */
    #reticle {
      position:fixed; z-index:90;
      width:48px; height:48px;
      transform:translate(-50%,-50%);
      pointer-events:none; display:none;
    }
    #reticle::before, #reticle::after {
      content:''; position:absolute; background:#fff; opacity:0.8;
      top:50%; left:50%;
    }
    #reticle::before { width:2px; height:28px; transform:translate(-50%,-50%); }
    #reticle::after  { width:28px; height:2px; transform:translate(-50%,-50%); }

    /* debug */
    #debug {
      position:fixed; top:60px; left:10px; right:10px; z-index:300;
      font-size:12px; color:#0f0; pointer-events:none;
      font-family:monospace; text-shadow:0 0 4px #000;
    }

    /* full-screen tap catcher */
    #tap-surface {
      position:fixed; inset:0; z-index:50; display:none;
    }

    a-scene { position:fixed; inset:0; }
  </style>

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          async crossorigin="anonymous" data-preload-chunks="slam"></script>
</head>
<body>

  <div id="overlay">
    <div class="icon">&#128444;</div>
    <h1>View in your room</h1>
    <p>Walk up close to a wall. Hold your phone up, pointing toward the wall. Then tap anywhere to place the painting.</p>
    <button id="start-btn">Start AR</button>
  </div>

  <div id="hud"><span id="hud-text">Walk toward a wall and tap to place</span></div>
  <div id="actions">
    <button id="btn-move">Move it</button>
    <button id="btn-info">Size info</button>
  </div>
  <div id="info-bar"><span id="info-text"></span></div>
  <div id="debug">Starting...</div>
  <div id="reticle"></div>
  <div id="tap-surface"></div>

  <a-scene
    xrconfig
    xrweb="disableWorldTracking: false; allowedDevices: any; scale: absolute"
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="painting-tex" crossorigin="anonymous"/>
    </a-assets>

    <a-camera id="camera" position="0 1.4 0"></a-camera>

    <a-entity id="painting-root" visible="false">
      <a-plane id="painting-plane" width="1" height="1"
        material="src:#painting-tex; shader:standard; roughness:0.88; metalness:0.02; side:front"
        position="0 0 0"></a-plane>
      <a-plane id="painting-frame" width="1.06" height="1.06"
        material="color:#1c1c1c; roughness:0.85; metalness:0.15"
        position="0 0 -0.004"></a-plane>
      <a-plane id="wall-shadow" width="1.22" height="1.22"
        material="color:#000; opacity:0.15; transparent:true; side:front"
        position="0 0 -0.008"></a-plane>
    </a-entity>

    <a-light type="ambient"     id="ambient-light" intensity="0.65"></a-light>
    <a-light type="directional" id="dir-light"     intensity="0.8" position="1 3 1"></a-light>
  </a-scene>

<script>
  // ── Params ──────────────────────────────────────────────────────────────
  const p      = new URLSearchParams(location.search)
  const imgUrl = p.get('img') || 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/402px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg'
  const wCm    = parseFloat(p.get('w'))     || 77
  const hCm    = parseFloat(p.get('h'))     || 100
  const title  = p.get('title') || 'Painting'
  const wM = wCm / 100
  const hM = hCm / 100

  // ── Debug ────────────────────────────────────────────────────────────────
  const dbg = document.getElementById('debug')
  const log = (msg) => { dbg.textContent = msg; console.log('[AR]', msg) }

  // ── State ────────────────────────────────────────────────────────────────
  let arStarted  = false
  let sceneReady = false
  let tapCount   = 0

  // ── Init dimensions ──────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('painting-tex').src = imgUrl
    document.getElementById('info-text').textContent = title + '  ·  ' + wCm + ' x ' + hCm + ' cm'
    const plane  = document.getElementById('painting-plane')
    const frame  = document.getElementById('painting-frame')
    const shadow = document.getElementById('wall-shadow')
    plane.setAttribute('width', wM);       plane.setAttribute('height', hM)
    frame.setAttribute('width', wM+0.06);  frame.setAttribute('height', hM+0.06)
    shadow.setAttribute('width', wM+0.22); shadow.setAttribute('height', hM+0.22)
  })

  // ── Engine + scene ready events ──────────────────────────────────────────
  window.addEventListener('xrloaded', () => log('XR engine ready'))

  document.querySelector('a-scene').addEventListener('loaded', () => {
    sceneReady = true
    log('Scene ready - tap anywhere to place')
  })

  // ── Start button ─────────────────────────────────────────────────────────
  document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('overlay').style.display     = 'none'
    document.getElementById('hud').style.display         = 'block'
    document.getElementById('tap-surface').style.display = 'block'
    document.getElementById('reticle').style.display     = 'block'
    arStarted = true
    log('AR started - walk up to wall and tap')
  })

  // ── PLACEMENT STRATEGY ───────────────────────────────────────────────────
  // Rather than relying on raycasting with camera direction (unreliable on
  // iOS before SLAM fully warms up), we use a simpler forward-projection:
  //
  //   1. Get camera world position (x, y, z)
  //   2. Get camera horizontal facing direction (yaw only - ignores phone tilt)
  //   3. Project 1.5m forward along that horizontal direction
  //   4. Place painting there at eye height, facing back toward the camera
  //
  // This means: stand ~1-2m from wall, point phone AT the wall, tap.
  // The painting appears on the wall in front of you at eye height.
  // No floor detection needed. Works regardless of phone tilt.

  function getPlacementPoint() {
    const camEl = document.getElementById('camera')
    if (!camEl || !camEl.object3D) return null

    const cam = camEl.object3D

    // Camera world position
    const pos = new THREE.Vector3()
    cam.getWorldPosition(pos)

    // Camera world quaternion -> extract yaw (Y rotation only, ignore pitch/roll)
    const quat = new THREE.Quaternion()
    cam.getWorldQuaternion(quat)

    // Convert quaternion to euler, extract Y (yaw) only
    const euler = new THREE.Euler().setFromQuaternion(quat, 'YXZ')
    const yaw   = euler.y

    // Forward vector using yaw only (horizontal, ignores phone tilt)
    const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).negate()

    // Use actual camera height if sane, otherwise fallback
    const camHeight = (pos.y > 0.3 && pos.y < 3.0) ? pos.y : 1.4

    // Place 1.5m ahead horizontally
    const DIST = 1.5
    const wallPoint = new THREE.Vector3(
      pos.x + forward.x * DIST,
      camHeight,           // same height as camera = eye level
      pos.z + forward.z * DIST
    )

    // Painting faces back toward camera (wall normal = toward camera)
    const normal = forward.clone().negate()

    return { wallPoint, normal, camHeight, yaw, forward }
  }

  // ── Tap handler ───────────────────────────────────────────────────────────
  function handleTap(clientX, clientY) {
    tapCount++
    log('Tap #' + tapCount + ' | arStarted=' + arStarted + ' sceneReady=' + sceneReady)

    if (!arStarted) { log('Not started yet'); return }

    // Allow tapping even before sceneReady - just use fallback placement
    const result = getPlacementPoint()
    if (!result) {
      log('Camera object not ready yet - try again in a moment')
      return
    }

    const { wallPoint, normal, camHeight, yaw } = result
    log('Placing | camH=' + camHeight.toFixed(2) + ' yaw=' + (yaw * 180/Math.PI).toFixed(0) + 'deg | pt=' + wallPoint.x.toFixed(2) + ',' + wallPoint.z.toFixed(2))

    hangPainting(wallPoint, normal)
  }

  // ── Wire up tap surface ───────────────────────────────────────────────────
  const tapSurface = document.getElementById('tap-surface')

  tapSurface.addEventListener('touchend', (e) => {
    e.preventDefault()
    const t = e.changedTouches[0]
    handleTap(t.clientX, t.clientY)
  }, { passive: false })

  tapSurface.addEventListener('click', (e) => {
    handleTap(e.clientX, e.clientY)
  })

  // ── Move reticle with device orientation (visual guide) ──────────────────
  // Shows a crosshair at screen centre to indicate placement point
  const reticle = document.getElementById('reticle')
  setInterval(() => {
    if (!arStarted) return
    // Keep reticle at screen centre
    reticle.style.left = (window.innerWidth  / 2) + 'px'
    reticle.style.top  = (window.innerHeight / 2) + 'px'
  }, 100)

  // ── Place painting ────────────────────────────────────────────────────────
  function hangPainting(pt, normal) {
    const root = document.getElementById('painting-root')

    const px = pt.x + normal.x * 0.05   // small offset so it's in front of wall surface
    const py = pt.y
    const pz = pt.z + normal.z * 0.05

    // Rotation: painting faces normal direction
    const yRot = Math.atan2(normal.x, normal.z) * (180 / Math.PI)

    root.setAttribute('position', px + ' ' + py + ' ' + pz)
    root.setAttribute('rotation', '0 ' + yRot + ' 0')
    root.setAttribute('visible', 'true')

    log('Placed at ' + px.toFixed(2) + ',' + py.toFixed(2) + ',' + pz.toFixed(2) + ' rot=' + yRot.toFixed(0) + 'deg')

    document.getElementById('hud-text').textContent   = 'Tap anywhere to reposition'
    document.getElementById('actions').style.display  = 'block'
    document.getElementById('info-bar').style.display = 'block'
  }

  // ── Move button ───────────────────────────────────────────────────────────
  document.getElementById('btn-move').addEventListener('click', (e) => {
    e.stopPropagation()
    document.getElementById('painting-root').setAttribute('visible', 'false')
    document.getElementById('actions').style.display  = 'none'
    document.getElementById('info-bar').style.display = 'none'
    document.getElementById('hud-text').textContent   = 'Walk up to a wall and tap'
    log('Reset - tap to place again')
  })

  // ── Size info ─────────────────────────────────────────────────────────────
  document.getElementById('btn-info').addEventListener('click', (e) => {
    e.stopPropagation()
    const bar = document.getElementById('info-bar')
    bar.style.display = bar.style.display === 'none' ? 'block' : 'none'
  })

  // ── Light estimation ──────────────────────────────────────────────────────
  setInterval(() => {
    if (!window.XR8) return
    try {
      const le = XR8.XrController.getLightEstimate && XR8.XrController.getLightEstimate()
      if (!le) return
      const i = Math.max(0.3, Math.min(1.8, le.ambientIntensity / 900))
      document.getElementById('dir-light').setAttribute('intensity', i.toFixed(2))
    } catch(e) {}
  }, 600)

</script>
</body>
</html>
